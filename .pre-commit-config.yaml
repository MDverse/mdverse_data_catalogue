---
# Install pre-commit hooks with:
# uv run prek install
# Update hooks:
# uv run prek update
exclude: "scripts/*|tmp/*"
repos:

  - repo: builtin
    # Built-in Prek hooks
    hooks:
      # Detect private keys and credentials in the code.
      - id: detect-private-key
      # Make sure files end in a newline and only a newline.
      - id: end-of-file-fixer
      # Replace or checks mixed line ending.
      - id: mixed-line-ending
      # Trim trailing whitespace.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # Fix JSON syntax.
      - id: check-json
      # Pretty format JSON files.
      - id: pretty-format-json
        args: ["--autofix"]
      # Fix YAML syntax.
      - id: check-yaml
      # Fix TOML syntax.
      - id: check-toml
      # Prevent committing large files.
      - id: check-added-large-files
        # Set max file size to 500 KB.
        args: ["--maxkb=500"]

  - repo: https://github.com/asottile/pyupgrade
    # Automatically upgrade syntax for newer versions of the Python language.
    rev: v3.22.0
    hooks:
      - id: pyupgrade

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Linter and formatter for Python code.
    rev: v0.17.4
    hooks:
      # Run the linter.
      # Automatically fix issues where possible.
      - id: ruff-check
        types: [python]
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        types: [python]

  # YAML
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.50.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--ignore', 'docs/database_schema.md']

  # Shell
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: https://github.com/PyCQA/bandit
    # Security linter for Python code.
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", ".bandit.yaml"]
        # Run only on demand with:
        # uv run prek run --hook-stage manual bandit --all-files
        stages: [manual]
